<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock — Usuários</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="users.js"></script>
</head>
<body>
  <div class="pdt-container">
    <header>
      <h1>Users</h1>
      <div class="header-actions">
        <a href="index.html" class="back-btn"><i class="bi bi-arrow-left"></i> Back</a>
        <span id="user-info"></span>
        <button type="button" id="logout-btn" title="Logout"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </header>

    <!-- Formulário de criação -->
    <form id="user-form">
      <div class="form-control">
        <input type="text" id="new-username" class="prodInput" placeholder="Username" />
        <input type="password" id="new-password" class="prodInput" placeholder="Password" />
        <select id="new-role" class="prodInput">
          <option value="">Role</option>
          <option value="operator">Operator</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit" class="add">Add User <i class="bi bi-plus"></i></button>
    </form>

    <!-- Lista de usuários -->
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Role</th>
          <th class="define"></th>
        </tr>
      </thead>
      <tbody id="user-list"></tbody>
    </table>
  </div>
</body>
</html>
